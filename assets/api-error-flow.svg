<svg width="920" height="620" viewBox="0 0 920 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="920" height="620" rx="24" fill="#FFFFFF"/>
  <rect x="46" y="44" width="828" height="532" rx="20" fill="#F8FAFC" stroke="#DBE3EF"/>
  <text x="74" y="96" fill="#182033" font-family="Arial, sans-serif" font-size="28" font-weight="800">API Error Ownership Flow</text>
  <text x="74" y="128" fill="#647084" font-family="Arial, sans-serif" font-size="15">Every response goes through envelope parsing and DTO validation before UI rendering.</text>
  <g>
    <rect x="80" y="190" width="170" height="76" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="118" y="222" fill="#182033" font-family="Arial, sans-serif" font-size="18" font-weight="800">Request</text>
    <text x="112" y="246" fill="#647084" font-family="Arial, sans-serif" font-size="13">Axios interceptor</text>
  </g>
  <g>
    <rect x="308" y="190" width="170" height="76" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="346" y="222" fill="#182033" font-family="Arial, sans-serif" font-size="18" font-weight="800">Envelope</text>
    <text x="342" y="246" fill="#647084" font-family="Arial, sans-serif" font-size="13">success / error</text>
  </g>
  <g>
    <rect x="536" y="190" width="170" height="76" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="580" y="222" fill="#182033" font-family="Arial, sans-serif" font-size="18" font-weight="800">DTO</text>
    <text x="564" y="246" fill="#647084" font-family="Arial, sans-serif" font-size="13">class-validator</text>
  </g>
