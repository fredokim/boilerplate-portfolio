    <rect x="360" y="370" width="200" height="76" rx="12" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="408" y="402" fill="#166534" font-family="Arial, sans-serif" font-size="18" font-weight="800">Render UI</text>
    <text x="400" y="426" fill="#15803D" font-family="Arial, sans-serif" font-size="13">typed data only</text>
  </g>
  <path d="M250 228H308" stroke="#647084" stroke-width="3" stroke-linecap="round"/>
  <path d="M478 228H536" stroke="#647084" stroke-width="3" stroke-linecap="round"/>
  <path d="M620 266V330C620 352 598 370 560 396" stroke="#647084" stroke-width="3" stroke-linecap="round"/>
  <path d="M393 266V330C393 352 414 370 460 396" stroke="#647084" stroke-width="3" stroke-linecap="round"/>
